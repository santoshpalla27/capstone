# Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # ==================== CONTROL PLANE ====================
  - job_name: 'control-plane'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'control-plane'

  # ==================== MICROSERVICES ====================
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'api-gateway'

  - job_name: 'go-service'
    static_configs:
      - targets: ['go-service:3001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'go-service'

  - job_name: 'java-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['java-service:3002']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'java-service'

  - job_name: 'python-service'
    static_configs:
      - targets: ['python-service:3003']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'python-service'

  - job_name: 'node-service'
    static_configs:
      - targets: ['node-service:3004']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'node-service'

  # ==================== INFRASTRUCTURE ====================
  # Redis Exporter (if deployed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'redis'

  # MySQL Exporter (if deployed)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'mysql'

  # Kafka Exporter (if deployed)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'kafka'

  # MongoDB Exporter (if deployed)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'mongodb'
