# Application Configuration
spring:
  application:
    name: control-plane

  # MySQL - Topology-agnostic configuration
  datasource:
    url: jdbc:mysql://localhost:3306/controlplane?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: cpuser
    password: cppassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 2
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis - TOPOLOGY-AGNOSTIC CONFIGURATION
  # Supports: single node, sentinel, cluster, managed cloud
  data:
    redis:
      # Single node (default)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispassword}
      timeout: 5000ms
      connect-timeout: 3000ms
      
      # Cluster mode (uncomment for Redis Cluster)
      # cluster:
      #   nodes:
      #     - redis-node-1:6379
      #     - redis-node-2:6379
      #     - redis-node-3:6379
      #   max-redirects: 3
      
      # Sentinel mode (uncomment for Redis Sentinel)
      # sentinel:
      #   master: mymaster
      #   nodes:
      #     - sentinel-1:26379
      #     - sentinel-2:26379
      #     - sentinel-3:26379
      
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
        shutdown-timeout: 100ms

  # Kafka - Topology-agnostic configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: control-plane
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      # Resilience settings
      request.timeout.ms: 5000
      session.timeout.ms: 10000

# Server
server:
  port: 8080
  shutdown: graceful

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

# Health check settings
health:
  check:
    interval: 5000

# Microservices Gateway URL (local dev)
microservices:
  gateway:
    url: ${MICROSERVICES_GATEWAY_URL:http://localhost:8000}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Logging
logging:
  level:
    io.capstone: DEBUG
    org.springframework.web.socket: DEBUG

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    url: jdbc:mysql://mysql:3306/controlplane?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
  
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# Microservices Gateway URL (Docker)
microservices:
  gateway:
    url: ${MICROSERVICES_GATEWAY_URL:http://api-gateway:8000}
